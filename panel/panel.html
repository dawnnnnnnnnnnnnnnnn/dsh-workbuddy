<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WorkBuddy 工作台</title>
<style>
/* 数值全部照 WorkBuddy 自己的 token（--wb-*）：
   spacing 2/4/5/8/12/16/20/24 · radius 4/6/8/12/16/24 · font caption12 / body14(lh22)
   gray #FAFAFA #F7F7F7 #F2F2F2 #EBEBEB #E6E6E6 · brand #00C29A(浅) #22CBA8(深)
   文字 #000 / 70% / 50% · placeholder #8A9099 · 深色底 #141414 卡片 #1F1F1F */
:root{
  --bg-page:#FFFFFF; --bg-card:#FFFFFF;
  --bg-fill:#F2F2F2; --bg-subtle:#F7F7F7; --bg-hover:#EBEBEB; --bg-active:#E6E6E6;
  --bd-1:#E6E6E6; --bd-2:#EBEBEB; --bd-3:#F2F2F2;
  --tx-1:#000000; --tx-2:rgba(0,0,0,.70); --tx-3:rgba(0,0,0,.50); --tx-ph:#8A9099;
  --brand:#00C29A; --brand-hover:#40D1B3; --brand-soft:#DFF7F2; --brand-text:#009273;
  --ok:#0CBF5B; --ok-soft:#E7F8F0; --ok-text:#088F50;
  --warn:#FF8420; --warn-soft:#FFEDDF; --warn-text:#C3671C;
  --bad:#F64041; --bad-soft:#FCE8E8;
  --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px; --r-2xl:16px; --r-3xl:24px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 2px 8px rgba(0,0,0,.06);
  --shadow-pop:0 8px 24px rgba(0,0,0,.12);
  color-scheme:light;
}
html[data-scheme="dark"]{
  --bg-page:#141414; --bg-card:#1F1F1F;
  --bg-fill:#1F1F1F; --bg-subtle:#292929; --bg-hover:#242424; --bg-active:#3A3A3A;
  --bd-1:#262626; --bd-2:#3A3A3A; --bd-3:#242424;
  --tx-1:#FFFFFF; --tx-2:rgba(255,255,255,.65); --tx-3:rgba(255,255,255,.50); --tx-ph:#727882;
  --brand:#22CBA8; --brand-hover:#4CF0CE; --brand-soft:#0E2520; --brand-text:#22CBA8;
  --ok:#24C46C; --ok-soft:#153825; --ok-text:#43F08F;
  --warn:#C3671C; --warn-soft:#25180E; --warn-text:#EC7913;
  --bad:#DC4258; --bad-soft:#250E0E;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 2px 8px rgba(0,0,0,.45);
  --shadow-pop:0 8px 24px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  background:var(--bg-page); color:var(--tx-1);
  /* 字体栈与 dsh 外壳完全一致，避免 iframe 里 fallback 到别的字形 */
  font:400 14px/22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
  display:flex; flex-direction:column; min-height:0; overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
/* 版式照原版：头部在上，记录占满中间，输入卡固定底部，浮层向上展开。 */
body > .brand{order:1;}
body > .flash{order:2;}
body > .nav{order:3;}
body > .group{order:4;}
body > .list{order:5;}
body > .composer{order:6;}
body > .foot{order:7;}
/* 品牌头 */
.brand{padding:16px 16px 6px; display:flex; align-items:flex-start; gap:8px;}
.brand-main{flex:1; min-width:0;}
.brand-name{font-size:18px; font-weight:700; line-height:26px; letter-spacing:-.2px;}
.brand-ver{font-size:10px; line-height:14px; color:var(--tx-3); margin-top:1px;}
.chip{
  display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; border:none;
  border-radius:var(--r-lg); background:var(--bg-fill); color:var(--tx-1);
  font-family:inherit; font-weight:500; font-size:12px; line-height:1; cursor:pointer; white-space:nowrap; transition:background .15s ease;
}
.chip:hover{background:var(--bg-hover);}
.dot{width:6px; height:6px; border-radius:6px; background:var(--tx-3);}
.dot.ok{background:var(--ok);} .dot.warn{background:var(--warn);} .dot.bad{background:var(--bad);}
.dot.busy{animation:pulse 1.3s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.28}}
/* 左栏式导航 */
.nav{padding:0 8px 4px; display:flex; flex-direction:column; gap:2px;}
.navrow{
  display:flex; align-items:center; gap:10px; width:100%; height:36px; padding:0 8px;
  border:none; border-radius:var(--r-lg); background:transparent; color:var(--tx-1);
  font-family:inherit; font-weight:400; font-size:14px; line-height:22px; cursor:pointer; text-align:left; transition:background .15s ease;
}
.navrow:hover{background:var(--bg-subtle);}
.navrow.on{background:var(--bg-fill);}
.navrow .tail{margin-left:auto; font-size:12px; color:var(--tx-3);}
/* 输入卡：大圆角 + 细描边 + 轻阴影（照原版 chat-input） */
.composer{padding:8px 12px 10px; position:relative; z-index:20; flex:0 0 auto;}
.card-input{
  border:1px solid var(--bd-1); border-radius:var(--r-3xl); background:var(--bg-card);
  box-shadow:var(--shadow-md); overflow:visible; transition:border-color .15s ease; position:relative;
}
.card-input:focus-within{border-color:var(--brand);}
.card-input textarea{
  width:100%; min-height:64px; max-height:220px; resize:vertical; display:block; border:none; outline:none;
  background:transparent; color:var(--tx-1); font-family:inherit; font-weight:400; font-size:14px; line-height:22px; padding:14px 18px 6px;
  letter-spacing:0;
}
.card-input textarea::placeholder{color:var(--tx-ph);}
.input-foot{display:flex; align-items:center; gap:6px; padding:0 8px 8px 10px;}
.foot-left{display:flex; align-items:center; gap:2px; flex:1; min-width:0;}
.foot-right{display:flex; align-items:center; gap:6px; flex:0 0 auto;}
.tool{
  display:inline-flex; align-items:center; justify-content:center; gap:5px; height:30px; padding:0 8px;
  border:none; border-radius:var(--r-lg); background:transparent; color:var(--tx-2);
  font-family:inherit; font-weight:400; font-size:12px; line-height:1; cursor:pointer; transition:background .15s ease,color .15s ease;
}
.tool:hover{background:var(--bg-subtle); color:var(--tx-1);}
.tool .chev{opacity:.7;}
/* 右侧「当前模型」按钮（原版是 ⚡ 快速 ⌃ 那个） */
.model-btn{
  display:inline-flex; align-items:center; gap:5px; height:30px; padding:0 9px;
  border:1px solid var(--bd-2); border-radius:var(--r-lg); background:var(--bg-card);
  color:var(--tx-1); font-family:inherit; font-weight:500; font-size:12px; line-height:1; cursor:pointer; transition:border-color .15s ease,background .15s ease;
}
.model-btn:hover{background:var(--bg-subtle); border-color:var(--bd-1);}
.model-btn .chev{opacity:.55;}
.send{
  display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; padding:0;
  border:none; border-radius:var(--r-2xl); background:var(--brand); color:#fff; cursor:pointer;
  transition:background .15s ease, opacity .15s ease;
}
.send:hover{background:var(--brand-hover);}
.send:disabled{opacity:.35; cursor:not-allowed;}
/* 模型浮层 */
.pop{
  position:absolute; left:0; right:0; bottom:calc(100% + 8px); z-index:30;
  background:var(--bg-card); border:1px solid var(--bd-2); border-radius:var(--r-xl);
  box-shadow:var(--shadow-pop); padding:6px; max-height:min(52vh, 430px); overflow-y:auto; overscroll-behavior:contain;
}
.pop-left{right:auto; min-width:240px; max-width:min(320px, 90%);}
.tool-icon{width:28px; padding:0; justify-content:center;}
.plusrow .mcheck{margin-left:auto; color:var(--tx-3);}
.plusrow.is-off{opacity:.45; cursor:default;}
.plusrow.is-off:hover{background:transparent;}
.pathin{
  width:100%; height:28px; box-sizing:border-box; padding:0 8px;
  border:1px solid var(--bd-2); border-radius:var(--r-md); background:var(--bg-page);
  color:var(--tx-1); font-family:inherit; font-size:12px; outline:none;
}
.pathin:focus{border-color:var(--brand);}
.pop::-webkit-scrollbar{width:8px;}
.pop::-webkit-scrollbar-thumb{background:var(--bd-1); border-radius:8px;}
.mrow{
  display:flex; align-items:center; gap:8px; height:36px; padding:0 10px; border-radius:var(--r-lg);
  cursor:pointer; transition:background .12s ease;
}
.mrow:hover{background:var(--bg-subtle);}
.mrow.on{background:var(--bg-subtle);}
.mrow .mic{width:18px; height:18px; display:inline-flex; align-items:center; justify-content:center; flex:0 0 auto;}
.mico{width:18px; height:18px; display:block; object-fit:contain; border-radius:2px;}
.msvg{display:inline-flex; align-items:center; justify-content:center; color:var(--tx-1);}
.msvg > svg{width:100%; height:100%; display:block;}
.model-btn .mico, .model-btn .msvg{width:15px; height:15px;}
.mrow .mname{font-size:14px; line-height:22px; flex:0 0 auto;}
.mrow .mrate{margin-left:auto; font-size:12px; color:var(--tx-3); flex:0 0 auto;}
.mrow .mcheck{width:16px; flex:0 0 auto; color:var(--brand); display:inline-flex; align-items:center; justify-content:center;}
.badge{display:inline-flex; align-items:center; height:17px; padding:0 5px; border-radius:var(--r-sm); font-family:inherit; font-weight:500; font-size:10px; line-height:1; flex:0 0 auto;}
.badge.free{background:var(--ok-soft); color:var(--ok-text);}
.badge.sub{background:var(--warn-soft); color:var(--warn-text);}
.badge.night{background:var(--ok-soft); color:var(--ok-text);}
.pop-sep{height:1px; background:var(--bd-3); margin:6px 4px;}
.pop-foot{
  display:flex; align-items:center; gap:8px; height:36px; padding:0 10px; border-radius:var(--r-lg);
  font-size:14px; color:var(--tx-1); cursor:pointer;
}
.pop-foot:hover{background:var(--bg-subtle);}
/* 分组标题 + 筛选 */
.group{display:flex; align-items:center; gap:6px; padding:10px 16px 6px; font-family:inherit; font-weight:600; font-size:12px; line-height:18px; color:var(--tx-3);}
.group .n{font-weight:400;}
.seg{margin-left:auto; display:flex; gap:2px; padding:2px; background:var(--bg-fill); border-radius:var(--r-lg);}
.seg button{
  border:none; background:transparent; color:var(--tx-2); font-family:inherit; font-weight:500; font-size:12px; line-height:1;
  height:22px; padding:0 8px; border-radius:var(--r-md); cursor:pointer;
  transition:background .15s ease,color .15s ease;
}
.seg button:hover{color:var(--tx-1);}
.seg button.on{background:var(--bg-card); color:var(--tx-1); box-shadow:var(--shadow-sm);}
/* 列表 */
.list{flex:1 1 auto; min-height:0; overflow-y:auto; padding:0 8px 8px;}
.list::-webkit-scrollbar{width:8px;}
.list::-webkit-scrollbar-thumb{background:var(--bd-1); border-radius:8px;}
.empty{padding:32px 18px; text-align:center; color:var(--tx-3); font-size:13px; line-height:22px;}
.item{border-radius:var(--r-lg); padding:8px 10px; cursor:pointer; transition:background .15s ease;}
.item:hover,.item.on{background:var(--bg-subtle);}
.item-top{display:flex; align-items:center; gap:6px;}
.item-title{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; line-height:22px;}
.item-time{flex:0 0 auto; font-size:12px; color:var(--tx-3);}
.item-meta{margin-top:2px; display:flex; gap:8px; flex-wrap:wrap; font-size:12px; line-height:18px; color:var(--tx-3);}
.tag{display:inline-flex; align-items:center; height:20px; padding:0 6px; border-radius:var(--r-sm); font-family:inherit; font-weight:500; font-size:11px; line-height:1; flex:0 0 auto;}
.tag.ok{background:var(--ok-soft); color:var(--ok-text);}
.tag.run{background:var(--brand-soft); color:var(--brand-text);}
.tag.warn{background:var(--warn-soft); color:var(--warn-text);}
.tag.bad{background:var(--bad-soft); color:var(--bad);}
.tag .pip{width:5px; height:5px; border-radius:5px; background:currentColor; margin-right:4px; animation:pulse 1.3s ease-in-out infinite;}
.bar{height:2px; margin-top:8px; border-radius:2px; background:var(--bg-fill); overflow:hidden;}
.bar > i{display:block; width:38%; height:100%; background:var(--brand); animation:slide 1.5s ease-in-out infinite;}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}
.detail{margin-top:8px; cursor:default;}
.sec{font-family:inherit; font-weight:600; font-size:12px; line-height:18px; color:var(--tx-3); margin:8px 0 4px;}
pre{
  margin:0; background:var(--bg-fill); border-radius:var(--r-md); padding:10px 12px;
  font:400 12px/18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--tx-1);
  white-space:pre-wrap; word-break:break-word; max-height:240px; overflow:auto;
}
pre.prompt{color:var(--tx-2); max-height:120px;}
pre.err{color:var(--bad); background:var(--bad-soft);}
.actions{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.mini{
  display:inline-flex; align-items:center; gap:4px; height:26px; padding:0 9px;
  border:1px solid var(--bd-2); border-radius:var(--r-md); background:var(--bg-card);
  color:var(--tx-1); font-family:inherit; font-weight:500; font-size:12px; line-height:1; cursor:pointer; transition:background .15s ease,border-color .15s ease;
}
.mini:hover{background:var(--bg-subtle); border-color:var(--bd-1);}
.mini.bad{color:var(--bad); border-color:var(--bad-soft);}
/* 底栏 */
.foot{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:8px 16px;
  color:var(--tx-3); font-size:12px; line-height:18px; border-top:1px solid var(--bd-3);
}
.foot .spacer{margin-left:auto;}
.foot-btn{display:inline-flex; align-items:center; gap:4px; border:none; background:transparent;
  color:var(--tx-3); font-family:inherit; font-size:12px; line-height:1; cursor:pointer; padding:3px 5px; border-radius:var(--r-sm);}
.foot-btn:hover{background:var(--bg-subtle); color:var(--tx-2);}
.flash{margin:0 12px 6px; padding:7px 10px; border-radius:var(--r-lg); background:var(--bg-fill); color:var(--tx-2); font-size:12px; line-height:18px;}
.flash.bad{color:var(--bad); background:var(--bad-soft);}
.flash-retry{
  margin-left:8px; height:22px; padding:0 8px; border:1px solid currentColor;
  background:transparent; color:inherit; border-radius:var(--r-sm);
  font-family:inherit; font-size:12px; cursor:pointer; opacity:.9;
}
.flash-retry:hover{opacity:1; background:rgba(127,127,127,.12);}
.hidden{display:none !important;}
</style>
</head>
<body>
  <div class="brand">
    <div class="brand-main">
      <div class="brand-name">WorkBuddy</div>
      <div class="brand-ver" id="ver">V5.9.3</div>
    </div>
    <button class="chip" id="statusChip" title="点一下重新探测通道">
      <span class="dot" id="dot"></span><span id="status">连接中…</span>
    </button>
  </div>

  <div class="flash hidden" id="flash"></div>

  <div class="nav">
    <button class="navrow" id="newTask"></button>
    <button class="navrow" id="runningRow"></button>
  </div>

  <div class="composer">
    <div class="pop hidden" id="modelPop"></div>
    <div class="pop pop-left hidden" id="agentPop"></div>
    <div class="pop pop-left hidden" id="plusPop"></div>
    <div class="card-input">
      <textarea id="prompt" placeholder="今天帮你做些什么？ 任务书要自包含：路径、目标、输出格式都写上"></textarea>
      <div class="input-foot">
        <div class="foot-left">
          <button class="tool tool-icon" id="plusBtn" title="添加文件 / 模式 / 专家 / 技能 / 连接器"></button>
          <button class="tool" id="agentBtn" title="权限"></button>
        </div>
        <div class="foot-right">
          <button class="model-btn" id="modelBtn" title="选模型"></button>
          <button class="send" id="send" disabled title="派出 (Ctrl+Enter)"></button>
        </div>
      </div>
    </div>
  </div>

  <div class="group">
    交接记录 <span class="n" id="count">(0)</span>
    <div class="seg" id="seg">
      <button data-f="all" class="on">全部</button>
      <button data-f="running">运行</button>
      <button data-f="done">完成</button>
      <button data-f="failed">失败</button>
    </div>
  </div>
  <div class="list" id="list"><div class="empty">读取账本…</div></div>

  <div class="foot">
    <span id="footText">—</span>
    <span class="spacer"></span>
    <button class="foot-btn" id="clear"></button>
  </div>

    link:'M10.5 13.5a4 4 0 0 0 5.7 0l2.3-2.3a4 4 0 0 0-5.7-5.7L11.5 6.8M13.5 10.5a4 4 0 0 0-5.7 0L5.5 12.8a4 4 0 0 0 5.7 5.7l1.3-1.3',
    x:'M6 6l12 12M18 6L6 18', chevRight:'M9 6l6 6-6 6',
    checkCircle:'M8.3 12.2l2.5 2.5 5-5.2',
    alertTri:'M12 4.2l8.3 14.6H3.7zM12 9.5v4.2M12 16.6h.01',
    eye:'M12 18.5c6 0 9.5-6.5 9.5-6.5S18 5.5 12 5.5 2.5 12 2.5 12 6 18.5 12 18.5zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
    inbox:'M3 12h4l2 3h6l2-3h4M5 5h14l2 7v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z',
    shield:'M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z', globe:'M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18zM3 12h18M12 3c3 3 3 15 0 18',
  };
  function svg(d, size, extra) {
    const s = size || 16;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (extra || '') + '<path d="' + d + '"/></svg>';
  }
  /**
   * 只按原版下拉里真会出现的图标来映射（以 WorkBuddy 界面为准）：
   *   内置三档 → 原版 SVG（闪电 / 圆圈勾 / 菱形）
   *   Hy*      → HunyuanIcon（混元太极球）
   *   GLM      → GLMIcon（那个 Z）
   *   其余（DeepSeek / Kimi / MiniMax / 未知）→ DefaultModelIcon（原版就是那个圆）
   * 表里还留着 OpenAI / Anthropic / Gemini / Mistral… 的图标，
   * 那是原版给自定义 provider 用的，这里暂不启用。
   */
  function iconKeyOf(m) {
    const id = ((m && m.id) || '').toLowerCase();
    const t = ((((m && m.name) || '') + ' ' + id)).toLowerCase();
    if (id === 'fast-model') return 'FastModelIcon';
    if (id === 'balanced-model') return 'BalancedModelIcon';
    if (id === 'deep-model') return 'PrimaryModelIcon';
    if (/hy\d|hunyuan|混元/.test(t)) return 'HunyuanIcon';
    if (/glm|zhipu/.test(t)) return 'GLMIcon';
    return 'DefaultModelIcon';
  }
  function iconHtml(m, size) {
    const s = size || 18;
    if (!m) return '';
    const table = (typeof WB_ICONS === 'object' && WB_ICONS) || {};
    const svgStr = table[iconKeyOf(m)] || table.DefaultModelIcon || '';
    if (!svgStr) return '';
    // 内置三档是原版 SVG 文件（data URI），其余是从 asar 抽出的内联组件（currentColor 跟随主题）
    if (svgStr.startsWith('data:')) {
      return '<img class="mico" src="' + svgStr + '" width="' + s + '" height="' + s + '" alt="" draggable="false">';
    }
    return '<span class="msvg" style="width:' + s + 'px;height:' + s + 'px">' + svgStr + '</span>';
  }

  const $ = (id) => document.getElementById(id);
  const STATUS = { running:['运行中','run'], done:['完成','ok'], failed:['失败','bad'], cancelled:['已取消','warn'] };
  const AGENT_ICON = { 'general-purpose': SC.shield, pulse: SC.globe };

  function ago(ts){ if(!ts) return ''; const s=Math.max(0,Math.round((Date.now()-ts)/1000));
    if(s<10) return '刚刚'; if(s<60) return s+' 秒前'; const m=Math.floor(s/60);
    if(m<60) return m+' 分钟前'; const h=Math.floor(m/60); if(h<24) return h+' 小时前'; return Math.floor(h/24)+' 天前'; }
  function dur(ms){ if(ms==null) return ''; const s=Math.round(ms/1000);
    if(s<60) return s+'s'; const m=Math.floor(s/60); if(m<60) return m+'m'+String(s%60).padStart(2,'0')+'s';
    return Math.floor(m/60)+'h'+String(m%60).padStart(2,'0')+'m'; }
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  async function api(path, init){
    const res = await fetch(path, Object.assign({ headers:{'Content-Type':'application/json'}, cache:'no-store' }, init||{}));
    const text = await res.text();
    let body; try { body = text ? JSON.parse(text) : {}; } catch(e){ body = { ok:false, error:text.slice(0,300) }; }
    if(!res.ok && body.error===undefined) body.error='HTTP '+res.status;
    return body;
  }

  const qs = new URLSearchParams(location.search);
  const forced = qs.get('scheme');
  function applyScheme(s){ document.documentElement.setAttribute('data-scheme', s==='light'?'light':'dark'); }
  if(forced==='light'||forced==='dark') applyScheme(forced);
  else applyScheme(window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');

  const state = { jobs:[], models:[], agents:[], skills:[], app:{}, open:'', filter:'all', loading:true, sending:false,
                  model:'', agent:'', access:'default', skill:'', pop:'', plusView:'root' };
  let timer = 0;
  const runningJobs = () => state.jobs.filter(j=>j.status==='running');
  const visibleJobs = () => state.filter==='all' ? state.jobs : state.jobs.filter(j=>j.status===state.filter);
  const modelById = (id) => state.models.find(m=>m.id===id) || state.models[0] || null;

  function renderHead(){
    const app = state.app || {};
    const run = runningJobs().length;
    $('dot').className = 'dot ' + (app.gateway?'ok':app.running?'warn':'bad') + (run?' busy':'');
    $('status').textContent = app.gateway
      ? ('已连接' + (run?' · '+run+' 在跑':''))
      : app.running ? '预热中 · 稍等' : '未运行 · 去 App 发一句';
    $('statusChip').title = app.gateway
      ? ('网关端口 ' + app.port + ' · 点一下重新探测')
      : (app.running
          ? 'WorkBuddy 在跑，但预热网关还没起来（闲置会被回收）。在 WorkBuddy 里随便发一句话，几秒后点这里重试。'
          : 'WorkBuddy 没在运行。打开 WorkBuddy 桌面端，再点这里重新探测。');
    $('footText').textContent = app.gateway ? '账本 '+state.jobs.length+' 条'+(app.port?' · 端口 '+app.port:'') : '离线 · 点右上角重试';
  }

  function renderModelBtn(){
    const m = modelById(state.model);
    $('modelBtn').innerHTML = (m ? iconHtml(m, 15) : svg(SC.bolt,15)) +
      '<span>' + esc(m ? m.name : '模型') + '</span>' +
      '<span class="chev">' + svg(SC.chevUp, 12) + '</span>';
  }

  function renderAgentBtn(){
    const a = (typeof ACCESS_ITEMS !== 'undefined' ? ACCESS_ITEMS : []).find(x=>x.id===state.access) || ACCESS_ITEMS[0];
    $('agentBtn').innerHTML = accessIcon(a, 15) +
      '<span>' + esc(a.label) + '</span>' +
      '<span class="chev">' + svg(SC.chevDown, 12) + '</span>';
    $('agentBtn').title = a.hint || '';
  }

  let popSig = '';
  function renderPop(scroll){
    const pop = $('modelPop');
    if(state.pop !== 'model'){ pop.classList.add('hidden'); return; }
    pop.classList.remove('hidden');
    const rows = state.models.map((m)=>{
      const on = m.id === state.model;
      const badge = m.badge ? '<span class="badge '+(m.badge==='订阅优先'?'sub':'night')+'">'+esc(m.badge)+'</span>' : '';
      return '<div class="mrow'+(on?' on':'')+'" data-m="'+esc(m.id)+'" title="'+esc(m.desc||'')+'">' +
        '<span class="mic">'+iconHtml(m,18)+'</span>' +
        '<span class="mname">'+esc(m.name)+'</span>' + badge +
        '<span class="mrate">'+esc(m.credits ? m.credits+'x' : '')+'</span>' +
        '<span class="mcheck">'+(on?svg(SC.check,14):'')+'</span></div>';
    }).join('');
    pop.innerHTML = rows + '<div class="pop-sep"></div>' +
      '<div class="pop-foot" data-custom="1">'+svg(SC.pencil,15)+'<span>配置自定义模型</span></div>';
    // 只在打开时把当前项滚进视野，轮询刷新不动它
    if(scroll){
      const cur = pop.querySelector('.mrow.on');
      if(cur && cur.scrollIntoView){ try { cur.scrollIntoView({ block:'center' }); } catch(e){} }
    }
  }

  // ── 「+」命令菜单（照 WorkBuddy：添加文件 / 模式 / 专家 / 技能 / 连接器）──
  const PLUS_ITEMS = [
    { id:'file', icon:'paperclip', label:'添加文件', sub:'插入本地文件路径' },
    { sep:true },
    { id:'mode', icon:'feather', label:'模式', sub:'计划 / 编辑，跟随 WorkBuddy', off:true },
    { id:'expert', icon:'bot', label:'专家', sub:'选角色' },
    { id:'skill', icon:'wand', label:'技能', sub:'不选则由 WorkBuddy 自己挑' },
    { id:'conn', icon:'link', label:'连接器', sub:'需要 App 登录态', off:true },
  ];
  const ACCESS_ITEMS = [
    { id:'default', label:'默认权限', hint:'按 WorkBuddy 设置询问', icon:'shieldCheck' },
    { id:'full', label:'完全访问', hint:'不再询问，可直接改文件/执行命令', icon:'warning' },
    { id:'readonly', label:'只读', hint:'只读模式', icon:'shieldCheck' },
  ];
  /** 权限图标用 WorkBuddy 自己的 ShieldCheckIcon / WarningIcon（从 app.asar 抽出） */
  function accessIcon(a, size) {
    const table = (typeof ACCESS_ICONS === 'object' && ACCESS_ICONS) || {};
    const svgStr = table[a.icon] || '';
    if (!svgStr) return '';
    const color = a.id === 'full' ? 'var(--warn)' : (a.id === 'readonly' ? 'var(--tx-3)' : 'inherit');
    return '<span class="msvg" style="width:' + size + 'px;height:' + size + 'px;color:' + color + '">' + svgStr + '</span>';
  }

  function renderPlusBtn(){
    const open = state.pop === 'plus';
    $('plusBtn').innerHTML = svg(open ? SC.x : SC.plus, 16);
    $('plusBtn').title = open ? '收起' : '添加文件 / 模式 / 专家 / 技能 / 连接器';
    if (state.skill) $('plusBtn').title = '当前技能：' + state.skill;
  }

  function renderPlusPop(){
    const pop = $('plusPop');
    if(state.pop !== 'plus'){ pop.classList.add('hidden'); return; }
    pop.classList.remove('hidden');

    if(state.plusView === 'skill'){
      const list = state.skills || [];
      const autoOn = !state.skill;
      pop.innerHTML =
        '<div class="mrow" data-back="1"><span class="mic">' + svg(SC.chevDown,16) + '</span><span class="mname">技能</span>' +
        '<span class="mrate">返回</span></div><div class="pop-sep"></div>' +
        '<div class="mrow'+(autoOn?' on':'')+'" data-skill="" title="不指定，让执行方按任务自己挑">' +
          '<span class="mic">'+svg(SC.spark,16)+'</span><span class="mname">自动</span>' +
          '<span class="mrate">由它自己挑</span>' +
          '<span class="mcheck">'+(autoOn?svg(SC.check,14):'')+'</span></div>' +
        (list.length
          ? '<div class="pop-sep"></div>' + list.map((s)=>'<div class="mrow'+(s.id===state.skill?' on':'')+'" data-skill="'+esc(s.id)+'" title="'+esc(s.desc||'')+'">' +
              '<span class="mic">'+svg(SC.wand,16)+'</span><span class="mname">'+esc(s.name||s.id)+'</span>' +
              '<span class="mcheck">'+(s.id===state.skill?svg(SC.check,14):'')+'</span></div>').join('')
          : '');
      return;
    }

    if(state.plusView === 'expert'){
      const list = state.agents || [];
      pop.innerHTML =
        '<div class="mrow" data-back="1"><span class="mic">' + svg(SC.chevDown,16) + '</span><span class="mname">专家</span><span class="mrate">返回</span></div><div class="pop-sep"></div>' +
        list.map((a)=>'<div class="mrow'+(a.id===state.agent?' on':'')+'" data-expert="'+esc(a.id)+'">' +
            '<span class="mic">'+svg(AGENT_ICON[a.id]||SC.bot,16)+'</span><span class="mname">'+esc(a.name||a.label||a.id)+'</span>' +
            '<span class="mcheck">'+(a.id===state.agent?svg(SC.check,14):'')+'</span></div>').join('');
      return;
    }

    if(state.plusView === 'file'){
      pop.innerHTML =
        '<div class="mrow" data-back="1"><span class="mic">' + svg(SC.chevDown,16) + '</span><span class="mname">添加文件</span><span class="mrate">返回</span></div>' +
        '<div class="pop-sep"></div><div style="padding:2px 6px 8px">' +
        '<div class="mrate" style="margin:0 0 6px;color:var(--tx-3)">粘贴一个本地绝对路径，会插到任务书光标处</div>' +
        '<input class="pathin" id="pathInput" placeholder="粘贴一个绝对路径" />' +
        '<div style="margin-top:6px;display:flex;gap:6px"><button class="mini" id="pathOk">插入</button></div></div>';
      const inp = document.getElementById('pathInput');
      const ok = () => {
        const v = (inp && inp.value || '').trim();
        if(!v) return;
        const ta = $('prompt');
        const at = ta.selectionStart ?? ta.value.length;
        ta.value = ta.value.slice(0, at) + v + ta.value.slice(at);
        ta.focus();
        ta.selectionStart = ta.selectionEnd = at + v.length;
        $('send').disabled = !ta.value.trim();
        state.pop = ''; state.plusView = 'root'; renderAll();
      };
      const btn = document.getElementById('pathOk');
      if (btn) btn.onclick = ok;
      if (inp) inp.onkeydown = (e) => { if(e.key==='Enter'){ e.preventDefault(); ok(); } };
      return;
    }

    // 根菜单
    pop.innerHTML = PLUS_ITEMS.map((it) => {
      if (it.sep) return '<div class="pop-sep"></div>';
      const off = it.off ? ' is-off' : '';
      const badge = it.id==='skill' && state.skill ? '<span class="badge sub" style="margin-left:6px">'+esc(state.skill)+'</span>' : '';
      const chev = it.off ? '' : '<span class="mcheck" style="color:var(--tx-3)">'+svg(SC.chevRight,12)+'</span>';
      return '<div class="mrow plusrow'+off+'" data-plus="'+it.id+'"'+(it.off?' aria-disabled="true"':'')+'>' +
        '<span class="mic">'+svg(SC[it.icon],16)+'</span>' +
        '<span class="mname">'+esc(it.label)+'</span>' + badge + chev + '</div>';
    }).join('');
  }

  function renderAgentPop(){
    const pop = $('agentPop');
    if(state.pop !== 'agent'){ pop.classList.add('hidden'); return; }
    pop.classList.remove('hidden');
    pop.innerHTML = ACCESS_ITEMS.map((a) =>
      '<div class="mrow'+(a.id===state.access?' on':'')+'" data-access="'+a.id+'" title="'+esc(a.hint)+'">' +
      '<span class="mic">' + accessIcon(a, 16) + '</span>' +
      '<span class="mname">'+esc(a.label)+'</span>' +
      '<span class="mcheck">'+(a.id===state.access?svg(SC.check,14):'')+'</span></div>').join('');
  }

  function closeAllPops(){ state.pop = ''; state.plusView = 'root'; }

  function renderNav(){
    const run = runningJobs().length;
    $('runningRow').innerHTML = svg(SC.gauge,16) + '正在运行<span class="tail">'+run+'</span>';
    $('runningRow').classList.toggle('on', state.filter==='running');
  }

  function jobCard(job){
    const st = STATUS[job.status] || ['运行中','run'];
    const isOpen = state.open === job.id;
    const brief = (job.prompt||'').replace(/\s+/g,' ').trim();
    const m = modelById(job.model);
    const modelName = m ? m.name : (job.model || '默认模型');
    const meta = [modelName, job.agent, job.source==='panel'?'面板派出':'模型派出', dur(job.elapsedMs)]
      .filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join('');
    const pip = job.status==='running' ? '<span class="pip"></span>' : '';
    let detail = '';
    if(isOpen){
      detail = '<div class="detail">' +
        '<div class="sec">任务书</div><pre class="prompt">'+esc(job.prompt||'（空）')+'</pre>' +
        (job.status==='done' ? '<div class="sec">它交回的</div><pre>'+esc(job.text||'（空）')+'</pre>' : '') +
        (job.error ? '<div class="sec">错误</div><pre class="err">'+esc(job.error)+'</pre>' : '') +
        '<div class="actions">' +
        (job.status==='running' ? '<button class="mini bad" data-act="cancel" data-id="'+job.id+'">'+svg(SC.stop,12)+'停止</button>' : '') +
        (job.status==='done' ? '<button class="mini" data-act="copyText" data-id="'+job.id+'">'+svg(SC.copy,12)+'复制结果</button>' : '') +
        '<button class="mini" data-act="copyPrompt" data-id="'+job.id+'">'+svg(SC.copy,12)+'复制任务书</button>' +
        '<button class="mini" data-act="refill" data-id="'+job.id+'">填回输入框</button></div></div>';
    }
    return '<div class="item'+(isOpen?' on':'')+'" data-act="toggle" data-id="'+job.id+'">' +
      '<div class="item-top"><span class="tag '+st[1]+'">'+pip+st[0]+'</span>' +
      '<span class="item-title" title="'+esc(brief)+'">'+esc(brief||'（空任务书）')+'</span>' +
      '<span class="item-time">'+ago(job.createdAt)+'</span></div>' +
      '<div class="item-meta">'+meta+'</div>' +
      (job.status==='running' ? '<div class="bar"><i></i></div>' : '') + detail + '</div>';
  }

  function renderList(){
    const list = $('list');
    $('count').textContent = '('+state.jobs.length+')';
    if(state.loading){ list.innerHTML = '<div class="empty">读取账本…</div>'; return; }
    const rows = visibleJobs();
    if(!rows.length){
      list.innerHTML = '<div class="empty">'+svg(SC.inbox,22)+'<br><br>' +
        (state.jobs.length===0 ? '还没有交接记录。<br>在上面写任务书派出，或让对话里的模型调用 workbuddy 工具。' : '这个筛选下没有记录。') +
        '</div>';
      return;
    }
    list.innerHTML = rows.map(jobCard).join('');
  }

  let listSig = '';
  function jobsSignature(){
    return state.jobs.map(j=>j.id+'|'+j.status+'|'+(j.elapsedMs||0)).join(';') + '#' + state.filter + '#' + state.open;
  }
  function renderAll(){
    renderHead(); renderModelBtn(); renderAgentBtn(); renderPlusBtn(); renderNav();
    // 浮层只在真变了的时候重建：轮询不再每 1.2 秒重建 51 行（那是卡顿的来源）
    if(state.pop === 'model'){
      const sig = state.models.map(m=>m.id+':'+m.badge).join(',') + '#' + state.model;
      if(sig !== popSig){ popSig = sig; renderPop(true); }
    } else renderPop();
    renderAgentPop();
    renderPlusPop();
    const jsig = jobsSignature();
    if(jsig !== listSig){ listSig = jsig; renderList(); }
    [...$('seg').querySelectorAll('button')].forEach(b=>b.classList.toggle('on', b.dataset.f===state.filter));
  }

  function flash(text, bad, offerRetry){
    const el = $('flash');
    el.className = 'flash' + (bad?' bad':'');
    el.innerHTML = esc(text) + (offerRetry ? ' <button class="flash-retry" id="flashRetry">重试</button>' : '');
    clearTimeout(flash.t);
    flash.t = setTimeout(()=>el.classList.add('hidden'), offerRetry ? 9000 : 2400);
    if (offerRetry) {
      const btn = document.getElementById('flashRetry');
      if (btn) btn.onclick = () => { el.classList.add('hidden'); refresh(true); };
    }
  }

  async function refresh(probe){
    clearTimeout(timer);
    try{
      const next = await api(probe ? '/dsh-workbuddy/probe' : '/dsh-workbuddy/state');
      if(next && next.ok){
        if(probe){ state.app = next.app||{}; flash(next.app&&next.app.gateway?'通道正常':'通道不可用', !(next.app&&next.app.gateway)); }
        else {
          state.jobs = next.jobs||[];
          // 只要「有倍率」的模型：没倍率的是内部别名（Claude-default-1.x）、编辑器补全、图像/视频生成，原版下拉也不给选
          state.models = (next.models||[]).filter(m=>m && m.credits);
          state.agents = next.agents||[];
          state.skills = next.skills||[];
          state.app = next.app||{};
          state.loading = false;
          if(!state.model && state.models.length){
            const def = state.models.find(m=>m.isDefault) || state.models[0];
            state.model = def.id;
          }
          if(!state.agent && state.agents.length) state.agent = state.agents[0].id;
        }
        renderAll();
      } else { state.loading = false; renderAll(); }
    }catch(e){
      state.loading = false;
      try { renderAll(); } catch(err){ console.error('[dsh-workbuddy] renderAll failed:', err && err.message); }
      $('status').textContent = '读取失败'; $('statusChip').title = String((e&&e.message)||e);
    }
    timer = setTimeout(refresh, 1200);
  }

  async function submit(){
    const prompt = $('prompt').value.trim();
    if(!prompt || state.sending) return;
    state.sending = true;
    const btn = $('send'); btn.disabled = true; btn.innerHTML = svg(SC.gauge,16);
    try{
      const res = await api('/dsh-workbuddy/submit', { method:'POST', body: JSON.stringify({
        prompt, agent: state.agent || 'general-purpose', model: state.model, timeoutSec: 900,
        access: state.access, skill: state.skill,
      })});
      if(res.ok){ $('prompt').value=''; flash('已派出 · '+res.jobId); refresh(); }
      else flash(res.error||'派出失败', true, res.retryable !== false);
    }catch(e){ flash(String((e&&e.message)||e), true, true); }
    finally{
      state.sending = false;
      btn.innerHTML = svg(SC.send,16);
      btn.disabled = !$('prompt').value.trim();
    }
  }

  function openAgentMenu(){
    if(!state.agents.length) return;
    const cur = state.agents.findIndex(a=>a.id===state.agent);
    state.agent = state.agents[(cur+1)%state.agents.length].id;
    renderAgentBtn();
    flash('权限：' + (state.agents.find(a=>a.id===state.agent)||{}).name);
  }

  function wire(){
    $('newTask').innerHTML = svg(SC.plus,16) + '新建任务';
    $('send').innerHTML = svg(SC.send,16);
    $('clear').innerHTML = svg(SC.trash,12) + '清空';

    $('newTask').onclick = () => { state.filter='all'; renderAll(); $('prompt').focus(); };
    $('statusChip').onclick = () => refresh(true);
    $('runningRow').onclick = () => {
      state.filter = state.filter==='running' ? 'all' : 'running';
      const first = runningJobs()[0]; if(first) state.open = first.id;
      renderAll();
    };

    // 权限下拉（不是轮替）
    $('agentBtn').onclick = (e) => {
      e.stopPropagation();
      state.pop = state.pop === 'agent' ? '' : 'agent';
      renderAll();
    };

    // 「+」命令菜单
    $('plusBtn').onclick = (e) => {
      e.stopPropagation();
      state.pop = state.pop === 'plus' ? '' : 'plus';
      state.plusView = 'root';
      renderAll();
    };

    // 模型浮层
    $('modelBtn').onclick = (e) => {
      e.stopPropagation();
      state.pop = state.pop === 'model' ? '' : 'model';
      popSig = '';
      renderAll();
    };

    // 点别处收起所有浮层。
    // 注意：二级菜单点击会替换 innerHTML，旧 target 已脱离文档，closest() 查不到 ——
    // 所以这里必须用 composedPath()（记录的是点击发生时的原始路径），否则刚展开就被收起。
    document.addEventListener('click', (e) => {
      if(!state.pop) return;
      const path = (e.composedPath && e.composedPath()) || [];
      const inside = path.some((el) => el && el.id && ['modelPop','modelBtn','agentPop','agentBtn','plusPop','plusBtn'].includes(el.id));
      if(inside) return;
      closeAllPops();
      renderAll();
    });

    // 模型浮层内的选择
    $('modelPop').addEventListener('click', (e) => {
      const row = e.target.closest('[data-m]');
      if(row){ state.model = row.dataset.m; closeAllPops(); popSig=''; renderAll(); flash('模型：'+(modelById(state.model)||{}).name); return; }
      if(e.target.closest('[data-custom]')){ closeAllPops(); renderAll(); flash('自定义模型要在 WorkBuddy 客户端里配，这里跟随它的清单', true); }
    });

    // 权限浮层内的选择
    $('agentPop').addEventListener('click', (e) => {
      const row = e.target.closest('[data-access]');
      if(!row) return;
      state.access = row.dataset.access;
      closeAllPops(); renderAll();
      flash('权限：' + (ACCESS_ITEMS.find(a=>a.id===state.access)||{}).label);
    });

    // 「+」菜单内的选择
    $('plusPop').addEventListener('click', (e) => {
      const back = e.target.closest('[data-back]');
      if(back){ state.plusView = 'root'; renderPlusPop(); return; }

      const skill = e.target.closest('[data-skill]');
      if(skill){
        const v = skill.dataset.skill || '';
        state.skill = v === '' ? '' : (state.skill === v ? '' : v);
        closeAllPops(); renderAll();
        flash(state.skill ? ('技能：'+state.skill) : '技能：自动（由执行方自己挑）');
        return;
      }

      const expert = e.target.closest('[data-expert]');
      if(expert){ state.agent = expert.dataset.expert; closeAllPops(); renderAll(); flash('专家：' + ((state.agents.find(a=>a.id===state.agent)||{}).name || state.agent)); return; }

      const item = e.target.closest('[data-plus]');
      if(!item) return;
      if(item.classList.contains('is-off')) return;   // 模式 / 连接器：置灰，点了不动也不弹提示
      const id = item.dataset.plus;
      if(id === 'file'){ state.plusView = 'file'; renderPlusPop(); return; }
      if(id === 'expert'){ state.plusView = 'expert'; renderPlusPop(); return; }
      if(id === 'skill'){ state.plusView = 'skill'; renderPlusPop(); return; }
    });

    $('seg').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if(!b) return;
      state.filter = b.dataset.f; renderAll();
    });
    $('prompt').addEventListener('input', () => { $('send').disabled = !$('prompt').value.trim(); });
    $('prompt').addEventListener('keydown', (e) => {
      if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); submit(); }
    });
    $('send').onclick = submit;
    $('clear').onclick = async () => { await api('/dsh-workbuddy/clear', { method:'POST', body:'{}' }); refresh(); };
    $('list').addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-act]'); if(!btn) return;
      const act = btn.dataset.act;
      const job = state.jobs.find(j=>j.id===btn.dataset.id);
      if(act==='toggle'){ state.open = state.open===btn.dataset.id?'':btn.dataset.id; renderList(); return; }
      e.stopPropagation(); if(!job) return;
      if(act==='cancel'){
        const res = await api('/dsh-workbuddy/cancel', { method:'POST', body: JSON.stringify({ jobId: job.id }) });
        if(!res.ok) flash(res.error||'停止失败', true); refresh();
      } else if(act==='copyText' || act==='copyPrompt'){
        const text = act==='copyText' ? job.text : job.prompt;
        try{ await navigator.clipboard.writeText(text||''); flash('已复制'); }catch(err){ flash('复制失败', true); }
      } else if(act==='refill'){
        $('prompt').value = job.prompt||''; $('send').disabled = !$('prompt').value.trim(); $('prompt').focus();
      }
    });
  }

  wire();
  // 调试入口（浏览器里 __wb.renderAll() 能手动重绘并看到异常）
  window.__wb = { renderAll, renderAgentBtn, state, accessItems: () => ACCESS_ITEMS, accessIcons: () => ACCESS_ICONS };
  refresh();
  window.addEventListener('message', (e) => {
    const d = e && e.data;
    if(d && d.type==='dsh-workbuddy:scheme' && (d.scheme==='light'||d.scheme==='dark')) applyScheme(d.scheme);
  });
})();
</script>
</body>
</html>
